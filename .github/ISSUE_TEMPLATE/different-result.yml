name: Different result
description: You ran an entry and got a different number.
title: "[Different result] <entry or dataset slug>"
labels: ["different-result"]
body:
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: GPU / CPU, VRAM, OS.
      placeholder: RTX 4060 8 GB, Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Upstream commit and repro-cookbook commit you used.
    validations:
      required: true
  - type: textarea
    id: what-you-saw
    attributes:
      label: What you saw
      description: Numbers, error messages, logs. Paste the command you ran.
    validations:
      required: true
